# Optional, non-secret reference override. Defaults already live in compose.yaml.
# Validate: docker compose -f compose.yaml -f docker/compose.env.example.yaml config --quiet
# No env_file is loaded; do not add credentials or enable independent features here.
services:
  backend:
    environment:
      NODE_ENV: development
      HOST: 127.0.0.1
      PORT: "5000"
      DATA_ROOT: /workspace/DATA
      DB_PATH: /var/lib/secubuzz/sqlite/database.sqlite
      DB_BUSY_TIMEOUT_MS: "5000"
      AUTH_ALLOWED_ORIGINS: http://localhost:3001
      AUTH_ALLOW_HTTP_LOCAL: "true"
      AUTH_SESSION_TTL_SECONDS: "28800"
      AUTH_TRUST_PROXY_IPS: ""
      ATTACHMENT_STORAGE_DIR: /var/lib/secubuzz/attachments
  frontend:
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      AUTH_BACKEND_URL: http://127.0.0.1:5000
      NEXT_PUBLIC_AUTH_MODE: api
      NEXT_PUBLIC_AUTH_API_READY: "true"
      NEXT_PUBLIC_AUTH_API_BASE_PATH: /api/auth
      NEXT_PUBLIC_SECURE_CONTEXT_REQUIRED: "true"
      NEXT_PUBLIC_REALTIME_CONTRACT_READY: "false"
      NEXT_PUBLIC_ATTACHMENT_API_READY: "false"
      NEXT_PUBLIC_LIVEKIT_ENABLED: "false"
      NEXT_PUBLIC_AI_REMOTE_READY: "false"
